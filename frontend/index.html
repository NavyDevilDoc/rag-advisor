<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080f1a" />

    <!-- Primary identity -->
    <title>RAG Architecture Advisor — pick your RAG stack in 12 questions</title>
    <meta
      name="description"
      content="A 12-question wizard that recommends an optimal RAG architecture (Standard / Graph / Agentic) and evaluates its canonical pipeline against your specific constraints."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, Slack, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rag-advisor-production.up.railway.app/" />
    <meta property="og:title" content="RAG Architecture Advisor — pick your RAG stack in 12 questions" />
    <meta
      property="og:description"
      content="Recommends an optimal RAG architecture (Standard / Graph / Agentic) and evaluates its pipeline against your specific constraints. Free, no signup."
    />
    <meta property="og:image" content="https://rag-advisor-production.up.railway.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Results page of the RAG Architecture Advisor showing a Standard Vector RAG recommendation with fit scores and deployment paradigm." />

    <!-- Twitter / X large-image card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RAG Architecture Advisor" />
    <meta
      name="twitter:description"
      content="Pick your RAG stack in 12 questions. Recommends Standard / Graph / Agentic and evaluates its pipeline against your constraints."
    />
    <meta name="twitter:image" content="https://rag-advisor-production.up.railway.app/og-image.png" />

    <style>
      html, body, #root { height: 100%; margin: 0; background: #080f1a; }
      body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

      /* ─── Print-to-PDF ─────────────────────────────────────────────
         Goal: when a user hits Ctrl+P / Save as PDF on the results page,
         produce a clean, ink-friendly handoff document. Flip the dark
         theme to light, hide interactive elements, and keep page breaks
         from splitting content cards awkwardly. */
      @media print {
        /* Letter, generous margins, ink-economical color rendering */
        @page { size: letter; margin: 1.5cm; }
        html, body, #root {
          background: #ffffff !important;
          color: #0f172a !important;
          print-color-adjust: economy;
          -webkit-print-color-adjust: economy;
        }

        /* Hide all interactive controls + anything explicitly opted out */
        button, textarea, input, select, .print-hide {
          display: none !important;
        }

        /* Flip our dark surface backgrounds to white so they don't burn ink */
        [style*="#080f1a"],
        [style*="rgb(8, 15, 26)"],
        [style*="#0f172a"],
        [style*="rgb(15, 23, 42)"] {
          background: #ffffff !important;
        }

        /* Flip the light text colors we use on dark backgrounds to dark.
           Color-bearing accents (architecture green/purple/orange, score-bar
           fills, badges) keep their hue — those are signal-bearing. */
        [style*="#f1f5f9"],
        [style*="rgb(241, 245, 249)"],
        [style*="#e2e8f0"],
        [style*="rgb(226, 232, 240)"],
        [style*="#cbd5e1"],
        [style*="rgb(203, 213, 225)"],
        [style*="#94a3b8"],
        [style*="rgb(148, 163, 184)"] {
          color: #1e293b !important;
        }

        /* Don't split content cards across pages where avoidable */
        article > * { page-break-inside: avoid; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
